<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>APLIKASI UJIAN DIGITAL</title>
  <link rel="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjNAxCJ0ju5Cw-2QD8EPGHOJUCApGP6mu1GSG1CaNxZM6NmuvyRNuSKH2Pa5x5bWcqFEMu9KpLpMM-t67Ymt4Y7sE1mmaTkgIvXEiTRAULlv3Y3kwXThGRxr6PlaYeftXdAprBlOoT2oi7xMLmMa6QRbT88lnDMwTXXHTJf9Rj_7_AA-u2ZHDLA5dtD-B7O/s1600/WhatsApp%20Image%202026-10-08%20at%2015.42.51.jpeg" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbzzepUaTQdgNujRlPR5DIfaj75FtyksgEZD2zw5KY44DWbovmXjWuZEl7m1Twhukotd/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>
</body>
</html>
